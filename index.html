<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Documentação da API - Delivery</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
    <style>
        body { margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="swagger-ui"></div>

<!-- Script principal do Swagger -->
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin></script>
<!-- NOVO: Script obrigatório para renderizar a barra superior com o dropdown -->
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js" crossorigin></script>

<script>
    window.onload = () => {
        window.ui = SwaggerUIBundle({
            urls: [
                { url: "./swagger-docs/api-gateway.yaml", name: "Serviço de Autenticação" },
                { url: "./swagger-docs/register-service.yaml", name: "Serviço de Pedidos" },
            ],
            dom_id: '#swagger-ui',
            deepLinking: true,
            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset // Aqui usamos a função injetada pelo novo script
            ],
            layout: "StandaloneLayout", // Corrigido para mostrar o menu
        });
    };
</script>
</body>
</html>
